<svg xmlns="http://www.w3.org/2000/svg" width="731" height="410" viewBox="0 0 731 410"><rect width="731" height="410" fill="#FFFFFF"/><rect x="40.0" y="20.0" width="240.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4"/><text x="160.0" y="46.0" font-size="14" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">要所有点对之间的距离吗？</text><line x1="284.0" y1="41.0" x2="359.0" y2="41.0" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/><polygon points="366.0,41.0 356.9,45.1 356.9,36.9" fill="#059669"/><text x="325.0" y="34.0" font-size="14" fill="#059669" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">是</text><rect x="370.0" y="20.0" width="150.0" height="42.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="445.0" y="46.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">Floyd</text><text x="536.0" y="45.7" font-size="13" fill="#6B7280" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">O(n³)</text><line x1="160.0" y1="65.0" x2="160.0" y2="92.0" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/><polygon points="160.0,99.0 155.9,89.9 164.1,89.9" fill="#9CA3AF"/><text x="176.0" y="87.0" font-size="14" fill="#9CA3AF" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">否</text><rect x="40.0" y="102.0" width="240.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4"/><text x="160.0" y="128.0" font-size="14" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino Sans 