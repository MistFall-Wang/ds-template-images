-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">是</text><rect x="370.0" y="184.0" width="150.0" height="42.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="445.0" y="210.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">SPFA</text><text x="536.0" y="209.7" font-size="13" fill="#6B7280" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">平均 O(m)，最坏 O(n × m)</text><line x1="160.0" y1="229.0" x2="160.0" y2="256.0" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round"/><polygon points="160.0,263.0 155.9,253.9 164.1,253.9" fill="#9CA3AF"/><text x="176.0" y="251.0" font-size="14" fill="#9CA3AF" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">否</text><rect x="40.0" y="266.0" width="240.0" height="42.0" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 4"/><text x="160.0" y="292.0" font-size="14" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">每条边长度都是 1 吗？</text><line x1="284.0" y1="287.0" x2="359.0" y2="287.0" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/><polygon points="366.0,287.0 356.9,291.1 356.9,282.9" fill="#059669"/><text x="325.0" y="280.0" font-size="14" fill="#059669" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">是</text><rect x="370.0" y="266.0" width="150.0" height="42.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="445.0" y="292.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino 