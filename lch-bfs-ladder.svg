nt-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">hot</text><rect x="330.0" y="50.0" width="64.0" height="36.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="362.0" y="73.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">dot</text><rect x="330.0" y="140.0" width="64.0" height="36.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="362.0" y="163.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">lot</text><rect x="480.0" y="50.0" width="64.0" height="36.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="512.0" y="73.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">dog</text><rect x="480.0" y="140.0" width="64.0" height="36.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="512.0" y="163.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">log</text><rect x="630.0" y="95.0" width="64.0" height="36.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="662.0" y="118.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">cog</text><text x="18.0" y="218.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">边上写的是两个词共用的桶：hit 和 hot 都能变成 h*t，所以它们只差一个字母</text><text x="18.0" y="242.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">绿色 = 