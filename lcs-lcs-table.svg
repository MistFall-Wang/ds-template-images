ont-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">0  空</text><text x="80.0" y="156.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">1  a</text><text x="80.0" y="202.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">2  b</text><text x="80.0" y="248.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">3  c</text><text x="80.0" y="294.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">4  d</text><text x="80.0" y="340.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">5  e</text><text x="111.5" y="58.5" font-size="12.5" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">0</text><text x="157.5" y="58.5" font-size="12.5" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">1</text><text x="203.5" y="58.5" font-size="12.5" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">2</text><text x="249.5" y="58.5" font-size="12.5" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">3</text><text x="80.0" y="58.5" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">j</text><text x="56.0" y="75.5" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">i</text><text x="308.0" y="91.0" font-size="14" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">最后一个字符相同（绿）</text><text x="308.0" y="116.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">dp[3][2]：text1[2] = text2[1] = "c"</text><text x="308.0" y="141.0" font-size="14" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">读左上角 dp[2][1] = 1（橙），加 1 得 2</text><text x="308.0" y="166.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="308.0" y="191.0" font-size="14" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">最后一个字符不同（红）</text><text x="308.0" y="216.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">dp[4][3]：text1[3] = "d"，text2[2] = "e"</text><text x="308.0" y="241.0" font-size="14" fill="#7C3AED" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">读上面 dp[3][3] = 2 和左边 dp[4][2] = 2（紫），取大的得 2</text><text x="308.0" y="266.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="308.0" y="291.0" font-size="14" fill="#2563EB" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">答案在右下角 dp[5][3] = 3（蓝）</text></svg>