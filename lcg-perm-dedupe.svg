 y1="152.0" x2="461.2" y2="183.7" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><polygon points="466.7,188.0 457.0,185.6 462.0,179.1" fill="#9CA3AF"/><text x="462.7" y="162.1" font-size="13" fill="#9CA3AF" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">i=1</text><rect x="446.7" y="192.0" width="40.0" height="32.0" rx="8" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="5 4"/><text x="466.7" y="212.9" font-size="13.5" fill="#9CA3AF" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">✗</text><rect x="399.8" y="118.0" width="42.3" height="32.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="421.0" y="138.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">[2]</text><rect x="257.4" y="44.0" width="40.0" height="32.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="277.4" y="64.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">[]</text><text x="18.0" y="330.9" font-size="13.5" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">✗：nums[i] == nums[i-1]，而且 nums[i-1] 现在没被用（not used[i-1]）→ 跳过</text><text x="18.0" y="354.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">意思是：同一层里，前一个 1 已经试过并撤销了，再拿后一个 1 放在这个位置，得到的排列一模一样</text><text x="18.0" y="378.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">最左边那条路上 i=1 没被剪：那时 i=0 正在用（used[0] 是 True），两个 1 是放在不同位置</text></svg>