ht="700">4</text><rect x="558.0" y="90.0" width="61.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="588.5" y="112.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><text x="18.0" y="156.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">算 dp[5]（绿，nums[5] = 7）：子序列以 7 结尾，按「7 的前一个数是谁」分</text><text x="18.0" y="180.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">前面比 7 小的（橙）才能排在 7 前面：nums[2] = 2（dp[2] = 1），nums[3] = 5（dp[3] = 2），nums[4] = 3（dp[4] = 2）</text><text x="18.0" y="204.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">接在它们后面，长度分别是 1 + 1、2 + 1、2 + 1；7 也可以自己单独一个，长度 1</text><text x="18.0" y="228.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">dp[5] = 这些里最大的 = 3（比如 2, 5, 7 或 2, 3, 7）</text><text x="18.0" y="252.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">全部填完后答案 = max(dp) = 4（2, 3, 7, 18 或 2, 3, 7, 101）</text></svg>