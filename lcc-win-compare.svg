<svg xmlns="http://www.w3.org/2000/svg" width="780" height="469" viewBox="0 0 780 469"><rect width="780" height="469" fill="#FFFFFF"/><text x="18.0" y="23.4" font-size="15" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">求最长（LC 3 无重复字符的最长子串，s = "abcbd"，right 走到 3）</text><text x="18.0" y="46.9" font-size="13.5" fill="#6B7280" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">while 窗口不合法：缩。  循环停下时窗口刚变合法  →  在 while 之后更新答案</text><rect x="40.0" y="66.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="60.5" y="88.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">a</text><rect x="84.0" y="66.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="104.5" y="88.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">b</text><rect x="128.0" y="66.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="148.5" y="88.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">c</text><rect x="172.0" y="66.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="192.5" y="88.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">b</text><rect x="216.0" y="66.0" width="41.0" height="34.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/><text x="236.5" y="88.4" font-size="15" fill="#94A3B8" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d</text><text x="282.0" y="88.0" font-size="14" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">窗口 "abcb" 有重复，不合法  →  left 右移，不更新</text><rect x="40.0" y="112.0" width="41.0" height="34.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/><text x="60.5" y="134.4" font-size="15" fill="#94A3B8" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">a</text><rect x="84.0" y="112.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="104.5" y="134.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">b</text><rect x="128.0" y="112.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="148.5" y="134.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">c</text><rect x="172.0" y="112.0" width="41.0" height="34.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="192.5" y="134.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">b</text><rect x="216.0" y="112.0" width="41.0" height="34.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/><text x="236.5" y="134.4" font-size="15" fill="#94A3B8" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d</text><text x="282.0" y="134.0" font-size="14" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">窗口 "bcb" 有重复，不合法  →  left 右移，不更新</text><rect x="40.0" y="158.0" width="41.0" h