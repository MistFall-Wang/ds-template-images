<svg xmlns="http://www.w3.org/2000/svg" width="950" height="178" viewBox="0 0 950 178"><rect width="950" height="178" fill="#FFFFFF"/><line x1="79.2" y1="121.5" x2="213.5" y2="61.8" stroke="#D97706" stroke-width="1.8" stroke-linecap="round"/><polygon points="219.9,58.9 213.2,66.4 209.9,58.9" fill="#D97706"/><line x1="259.2" y1="58.5" x2="393.5" y2="118.2" stroke="#D97706" stroke-width="1.8" stroke-linecap="round"/><polygon points="399.9,121.1 389.9,121.1 393.2,113.6" fill="#D97706"/><line x1="81.0" y1="130.0" x2="391.0" y2="130.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><polygon points="398.0,130.0 388.9,134.1 388.9,125.9" fill="#475569"/><circle cx="60.0" cy="130.0" r="19" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="60.0" y="135.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">i</text><circle cx="240.0" cy="50.0" r="19" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="240.0" y="55.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">k</text><circle cx="420.0" cy="130.0" r="19" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="420.0" y="135.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">j</text><text x="140.0" y="81.0" font-size="14" fill="#D97706" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">dist[i][k]</text><text x="340.0" y="81.0" font-size="14" fill="#D97706" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">dist[k][j]</text><text x="240.0" y="153.0" font-size="14" fill="#1F2937" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">dist[i][j]（现在已知的）</text><text x="240.0" y="24.9" font-size="13.5" fill="#D97706" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">中转点 k</text><text x="500.0" y="64.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">从 i 到 j：要么走现在已知的路，要么先到 k 再到 j</text><text x="500.0" y="92.9" font-size="13.5" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])</text><text x="500.0" y="120.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">把每个点轮流拿来当中转点 k 试一遍</text></svg>