<svg xmlns="http://www.w3.org/2000/svg" width="1035" height="363" viewBox="0 0 1035 363"><rect width="1035" height="363" fill="#FFFFFF"/><text x="18.0" y="23.2" font-size="14.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">stones = [1, 3, 5, 2] 的 dp 表</text><text x="105.0" y="67.0" font-size="11" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">right=0</text><text x="167.0" y="67.0" font-size="11" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">right=1</text><text x="229.0" y="67.0" font-size="11" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">right=2</text><text x="291.0" y="67.0" font-size="11" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">right=3</text><text x="70.0" y="105.0" font-size="11" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">left=0</text><text x="70.0" y="167.0" font-size="11" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">left=1</text><text x="70.0" y="229.0" font-size="11" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">left=2</text><text x="70.0" y="291.0" font-size="11" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">left=3</text><rect x="80.0" y="76.0" width="50.0" height="50.0" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/><text x="105.0" y="106.4" font-size="15" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><rect x="142.0" y="76.0" width="50.0" height="50.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="167.0" y="106.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><rect x="204.0" y="76.0" width="50.0" height="50.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="229.0" y="106.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">13</text><rect x="266.0" y="76.0" width="50.0" height="50.0" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/><text x="291.0" y="106.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">22</text><rect x="142.0" y="138.0" width="50.0" height="50.0" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/><text x="167.0" y="168.4" font-size="15" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><rect x="204.0" y="138.0" width="50.0" height="50.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="229.0" y="168.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">8</text><rect x="266.0" y="138.0" width="50.0" height="50.0" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/><text x="291.0" y="168.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">17</text><rect x="204.0" y="200.0" width="50.0" height="50.0" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/><text x="229.0" y="230.4" font-size="15" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><rect x="266.0" y="200.0" width="50.0" height="50.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="291.0" y="230.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">7</text><rect x="266.0" y="262.0" width="50.0" height="50.0" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/><text x="291.0" y="292.4" font-size="15" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><text x="80.0" y="338.5" font-size="12.5" fill="#6B7280" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">灰：长度 1　蓝：长度 2　紫：长度 3　红：dp[0][3]，答案</text><text x="398.0" y="23.2" font-size="14.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">dp[0][3]：最后一次合并从哪里分开（split 是左半段的最后一堆）</text><text x="398.0" y="79.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">split = 0</text><rect x="490.0" y="58.0" width="37.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="508.5" y="80.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><rect x="552.0" y="58.0" width="37.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="570.5" y="80.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><rect x="592.0" y="58.0" width="37.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="610.5" y="80.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><rect x="632.0" y="58.0" width="37.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="650.5" y="80.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2</text><text x="539.0" y="81.5" font-size="18" fill="#DC2626" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">|</text><text x="698.0" y="79.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">dp[0][0] + dp[1][3] = 0 + 17 = 17</text><text x="398.0" y="129.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">split = 1</text><rect x="490.0" y="108.0" width="37.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="508.5" y="130.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><rect x="530.0" y="108.0" width="37.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="548.5" y="130.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><rect x="592.0" y="108.0" width="37.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="610.5" y="130.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><rect x="632.0" y="108.0" width="37.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="650.5" y="130.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2</text><text x="579.0" y="131.5" font-size="18" fill="#DC2626" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">|</text><text x="698.0" y="129.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">dp[0][1] + dp[2][3] = 4 + 7 = 11</text><text x="988.0" y="129.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">最小</text><text x="398.0" y="179.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">split = 2</text><rect x="490.0" y="158.0" width="37.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="508.5" y="180.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><rect x="530.0" y="158.0" width="37.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="548.5" y="180.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><rect x="570.0" y="158.0" width="37.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="588.5" y="180.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><rect x="632.0" y="158.0" width="37.0" height="34.0" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="650.5" y="180.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2</text><text x="619.0" y="181.5" font-size="18" fill="#DC2626" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">|</text><text x="698.0" y="179.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">dp[0][2] + dp[3][3] = 13 + 0 = 13</text><text x="398.0" y="227.0" font-size="14" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">dp[0][3] = 11 + 整段的总重量 11 = 22</text><text x="398.0" y="252.7" font-size="13" fill="#6B7280" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">不管从哪里分，最后一次合并的代价都是整段的总重量</text></svg>