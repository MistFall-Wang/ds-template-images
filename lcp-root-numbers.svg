<svg xmlns="http://www.w3.org/2000/svg" width="890" height="273" viewBox="0 0 890 273"><rect width="890" height="273" fill="#FFFFFF"/><text x="18.0" y="23.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">root = [4, 9, 0, 5, 1]</text><line x1="279.9" y1="90.1" x2="194.9" y2="143.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><polygon points="188.9,147.4 194.5,139.0 198.8,145.9" fill="#475569"/><line x1="160.2" y1="172.9" x2="126.8" y2="214.9" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><polygon points="122.4,220.3 124.9,210.7 131.3,215.7" fill="#475569"/><line x1="183.8" y1="172.9" x2="217.2" y2="214.9" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><polygon points="221.6,220.3 212.7,215.7 219.1,210.7" fill="#475569"/><line x1="307.8" y1="94.9" x2="341.2" y2="136.9" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><polygon points="345.6,142.3 336.7,137.7 343.1,132.7" fill="#475569"/><circle cx="296.0" cy="80.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="296.0" y="85.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><circle cx="172.0" cy="158.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="172.0" y="163.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">9</text><circle cx="110.0" cy="236.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="110.0" y="241.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><circle cx="234.0" cy="236.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="234.0" y="241.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><circle cx="358.0" cy="158.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="358.0" y="163.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><text x="271.0" y="70.9" font-size="13.5" fill="#2563EB" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><text x="147.0" y="148.9" font-size="13.5" fill="#2563EB" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">49</text><text x="383.0" y="148.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">40</text><text x="85.0" y="226.9" font-size="13.5" fill="#059669" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">495</text><text x="259.0" y="226.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">491</text><text x="448.0" y="74.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">传下去的是「走到这里拼出来的数」number</text><text x="448.0" y="98.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    每往下走一步：number = number * 10 + node.val</text><text x="448.0" y="122.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    4 → 9：4 × 10 + 9 = 49；49 → 5：49 × 10 + 5 = 495</text><text x="448.0" y="146.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="448.0" y="170.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">叶子上的 number：[495, 491, 40]</text><text x="448.0" y="194.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">答案 = 495 + 491 + 40 = 1026</text></svg>