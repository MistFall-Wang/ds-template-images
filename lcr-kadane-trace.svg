-width="1.8"/><text x="332.5" y="160.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><rect x="366.0" y="138.0" width="61.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="396.5" y="160.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><rect x="430.0" y="138.0" width="61.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="460.5" y="160.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><rect x="494.0" y="138.0" width="61.0" height="34.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="524.5" y="160.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">6</text><rect x="558.0" y="138.0" width="61.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="588.5" y="160.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><rect x="622.0" y="138.0" width="61.0" height="34.0" rx="8" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="652.5" y="160.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><text x="18.0" y="206.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">dp[i]：以 nums[i] 结尾的子数组里，最大的和。每一格只有两种选法：接在前一段后面，或者从自己重新开始</text><text x="18.0" y="231.9" font-size="13.5" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">dp[3]（红）：前一段 dp[2] = −2 是负的，接上去只会更小，所以从自己重新开始，dp[3] = 4</text><text x="18.0" y="256.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">答案不在最后一格：最后一格 dp[8] = 5，最大的是 dp[6] = 6（绿），所以返回 max(dp)</text></svg>