ke-width="1.8"/><text x="494.0" y="245.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><circle cx="556.0" cy="318.0" r="17" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.8"/><text x="556.0" y="323.4" font-size="15" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><text x="284.0" y="73.9" font-size="13.5" fill="#2563EB" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><text x="222.0" y="151.9" font-size="13.5" fill="#2563EB" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">9</text><text x="456.0" y="151.9" font-size="13.5" fill="#2563EB" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">13</text><text x="98.0" y="229.9" font-size="13.5" fill="#2563EB" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">20</text><text x="346.0" y="229.9" font-size="13.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">26</text><text x="518.0" y="229.9" font-size="13.5" fill="#2563EB" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">17</text><text x="36.0" y="307.9" font-size="13.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">27</text><text x="208.0" y="307.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">22</text><text x="580.0" y="307.9" font-size="13.5" fill="#6B7280" text-anchor="start" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">18</text><text x="616.0" y="100.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">信息只往下传：</text><text x="616.0" y="124.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    dfs(node, total) 调孩子时，把 total + node.val 传下去</text><text x="616.0" y="148.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">答案在叶子上：</text><text x="616.0" y="172.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    走到叶子，一条「根 → 叶子」的路才算走完，</text><text x="616.0" y="196.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    这时的 total 就是这条路的和</text><text x="616.0" y="220.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="616.0" y="244.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">四个叶子的 total：[27, 22, 26, 18]</text><text x="616.0" y="268.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">叶子 2 的 total 是 22，等于 targetSum → True</text><text x="616.0" y="292.9" font-size="13.5" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">橙色的路：5 → 4 → 11 → 2</text></svg>