.0" y="246.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">沿第一行再往下走：1 → 2 → 2 → 2 → 5，高度差 1、0、0、3，最大的是 3，比 2 差</text><text x="30.0" y="272.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">一条路的代价 = 路上最大的那一步，不是把每一步加起来</text></svg>