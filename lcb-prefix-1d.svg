ang SC, monospace">2</text><rect x="322.0" y="120.0" width="61.0" height="34.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/><text x="352.5" y="142.4" font-size="15" fill="#94A3B8" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">8</text><text x="352.5" y="169.3" font-size="12" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">3</text><rect x="386.0" y="120.0" width="61.0" height="34.0" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="416.5" y="142.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">9</text><text x="416.5" y="169.3" font-size="12" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">4</text><rect x="450.0" y="120.0" width="61.0" height="34.0" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/><text x="480.5" y="142.4" font-size="15" fill="#94A3B8" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">14</text><text x="480.5" y="169.3" font-size="12" fill="#6B7280" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">5</text><line x1="160.5" y1="74.0" x2="160.5" y2="116.0" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="224.5" y1="74.0" x2="224.5" y2="116.0" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="288.5" y1="74.0" x2="288.5" y2="116.0" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="352.5" y1="74.0" x2="352.5" y2="116.0" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="416.5" y1="74.0" x2="416.5" y2="116.0" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="480.5" y1="74.0" x2="480.5" y2="116.0" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="548.0" y="36.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">prefix[i] = 虚线左边所有数的和（前 i 个数）</text><text x="548.0" y="63.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">prefix[4] = 3 + 1 + 4 + 1 = 9（绿）</text><text x="548.0" y="90.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">prefix[1] = 3（红）</text><text x="548.0" y="117.9" font-size="13.5" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">nums[1..3] 的和 = prefix[4] − prefix[1] = 9 − 3 = 6（橙）</text><text x="548.0" y="144.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">一般地：nums[left..right] 的和 = prefix[right + 1] − prefix[left]</text></svg>