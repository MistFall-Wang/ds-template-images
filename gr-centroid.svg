<svg xmlns="http://www.w3.org/2000/svg" width="701" height="313" viewBox="0 0 701 313"><rect width="701" height="313" fill="#FFFFFF"/><line x1="167.6" y1="80.4" x2="133.0" y2="120.8" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="192.4" y1="80.4" x2="227.0" y2="120.8" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="110.6" y1="152.5" x2="89.9" y2="188.6" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="129.4" y1="152.5" x2="150.1" y2="188.6" stroke="#9CA3AF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="160.0" y1="225.0" x2="160.0" y2="256.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="240.0" y1="155.0" x2="240.0" y2="186.0" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><circle cx="180.0" cy="66.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="180.0" y="71.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><circle cx="120.0" cy="136.0" r="17" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="5 4"/><text x="120.0" y="141.4" font-size="15" fill="#9CA3AF" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><circle cx="240.0" cy="136.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="240.0" y="141.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2</text><circle cx="80.0" cy="206.0" r="17" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="80.0" y="211.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><circle cx="160.0" cy="206.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="160.0" y="211.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><circle cx="160.0" cy="276.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="160.0" y="281.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><circle cx="240.0" cy="206.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="240.0" y="211.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">6</text><text x="18.0" y="21.2" font-size="14.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">n = 7，删掉点 1（虚线）：树断成 3 块</text><rect x="330.0" y="62.0" width="20.0" height="20.0" rx="4" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="360.0" y="77.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">上面那一块：n − size[1] = 7 − 4 = 3 个点</text><rect x="330.0" y="96.0" width="20.0" height="20.0" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="360.0" y="111.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">孩子 3 的子树：1 个点</text><rect x="330.0" y="130.0" width="20.0" height="20.0" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="360.0" y="145.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">孩子 4 的子树：2 个点</text><text x="330.0" y="180.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">size[1] = 1 + 1 + 2 = 4：dfs(1) 返回的子树大小</text><text x="330.0" y="206.9" font-size="13.5" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">删掉 1 后最大的一块 = max(1, 2, 3) = 3</text><text x="330.0" y="232.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">每个点都这样算一次，取最小的那个</text></svg>