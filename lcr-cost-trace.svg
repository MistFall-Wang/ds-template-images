t x="18.0" y="200.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">dp[i]：站到第 i 阶上，最少已经付了多少。dp[0] = dp[1] = 0：可以直接从第 0 阶或第 1 阶出发（灰）</text><text x="18.0" y="225.9" font-size="13.5" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">算 dp[7]：从第 6 阶跨 1 步上来，dp[6] + cost[6] = 3 + 1 = 4；从第 5 阶跨 2 步上来，dp[5] + cost[5] = 3 + 100 = 103</text><text x="18.0" y="250.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">取小的：dp[7] = min(4, 103) = 4。楼顶是下标 10（数组外面一格），答案 dp[10] = 6</text></svg>