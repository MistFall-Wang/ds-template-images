t-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">i = 0  一件都没有</text><text x="260.0" y="152.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">i = 1  体积 1 价值 2</text><text x="260.0" y="198.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">i = 2  体积 2 价值 4</text><text x="260.0" y="244.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">i = 3  体积 3 价值 4</text><text x="260.0" y="290.0" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace">i = 4  体积 4 价值 5</text><text x="260.0" y="71.5" font-size="12.5" fill="#6B7280" text-anchor="end" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">capacity</text><text x="580.0" y="87.0" font-size="14" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">正在算 dp[3][5]（绿）：第 3 件体积 3、价值 4</text><text x="604.0" y="112.0" font-size="14" fill="#7C3AED" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">不选第 3 件：正上方 dp[2][5] = 6（紫）</text><text x="604.0" y="137.0" font-size="14" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">选第 3 件：上一行往左 3 格 dp[2][2] = 4（橙），加 4 得 8</text><text x="604.0" y="162.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">取大的：max(6, 8) = 8</text><text x="580.0" y="187.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="580.0" y="212.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">每一格只读上一行：正上方，和左上方某一格</text><text x="580.0" y="237.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="580.0" y="262.0" font-size="14" fill="#2563EB" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">答案在右下角 dp[4][5] = 8（蓝）</text></svg>