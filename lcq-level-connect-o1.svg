<svg xmlns="http://www.w3.org/2000/svg" width="884" height="262" viewBox="0 0 884 262"><rect width="884" height="262" fill="#FFFFFF"/><text x="18.0" y="23.2" font-size="14.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">leftmost = 2：站在已经连好的第 2 层，顺着 next 走，把第 3 层连起来</text><line x1="118.6" y1="145.4" x2="83.4" y2="180.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="145.4" y1="145.4" x2="180.6" y2="180.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="366.6" y1="145.4" x2="331.4" y2="180.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="393.4" y1="145.4" x2="428.6" y2="180.6" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="239.0" y1="78.5" x2="149.0" y2="123.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><line x1="273.0" y1="78.5" x2="363.0" y2="123.5" stroke="#475569" stroke-width="1.8" stroke-linecap="round"/><circle cx="70.0" cy="194.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="70.0" y="199.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><circle cx="132.0" cy="132.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="132.0" y="137.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2</text><circle cx="194.0" cy="194.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="194.0" y="199.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">5</text><circle cx="256.0" cy="70.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="256.0" y="75.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><circle cx="318.0" cy="194.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="318.0" y="199.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">6</text><circle cx="380.0" cy="132.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="380.0" y="137.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><circle cx="442.0" cy="194.0" r="17" fill="#E8F0FE" stroke="#2563EB" stroke-width="1.8"/><text x="442.0" y="199.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">7</text><line x1="152.0" y1="132.0" x2="353.0" y2="132.0" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/><polygon points="360.0,132.0 350.9,136.1 350.9,127.9" fill="#059669"/><line x1="90.0" y1="194.0" x2="167.0" y2="194.0" stroke="#D97706" stroke-width="2.2" stroke-linecap="round"/><polygon points="174.0,194.0 164.9,198.1 164.9,189.9" fill="#D97706"/><line x1="338.0" y1="194.0" x2="415.0" y2="194.0" stroke="#D97706" stroke-width="2.2" stroke-linecap="round"/><polygon points="422.0,194.0 412.9,198.1 412.9,189.9" fill="#D97706"/><line x1="214.0" y1="194.0" x2="291.0" y2="194.0" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round"/><polygon points="298.0,194.0 288.9,198.1 288.9,189.9" fill="#DC2626"/><text x="540.0" y="66.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">绿色：上一轮已经连好的 next</text><text x="540.0" y="91.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    靠它从节点 2 走到节点 3</text><text x="540.0" y="116.9" font-size="13.5" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">橙色 ①：node.left.next = node.right</text><text x="540.0" y="141.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    4.next = 5、6.next = 7</text><text x="540.0" y="166.9" font-size="13.5" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">红色 ②：node.right.next = node.next.left</text><text x="540.0" y="191.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">    5.next = 6（node = 2，node.next = 3）</text><text x="18.0" y="236.9" font-size="13.5" fill="#6B7280" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">① 连的是同一个父节点的两个孩子；② 连的是相邻两个父节点之间的那一对，要靠父节点的 next 才找得到</text></svg>