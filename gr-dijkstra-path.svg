ke-width="1.8"/><text x="50.0" y="115.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">0</text><text x="50.0" y="86.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d=0</text><circle cx="170.0" cy="50.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="170.0" y="55.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">1</text><text x="170.0" y="26.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d=3</text><circle cx="170.0" cy="170.0" r="17" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/><text x="170.0" y="175.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2</text><text x="170.0" y="203.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d=1</text><circle cx="290.0" cy="50.0" r="17" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="290.0" y="55.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3</text><text x="290.0" y="26.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d=4</text><circle cx="290.0" cy="170.0" r="17" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.8"/><text x="290.0" y="175.4" font-size="15" fill="#94A3B8" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4</text><text x="290.0" y="203.9" font-size="13.5" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">d=∞</text><text x="380.0" y="38.9" font-size="13.5" fill="#059669" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">绿色的边：dist[v] 最后一次被更新时，v 是从谁走过来的</text><text x="380.0" y="66.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">parent = [-1, 2, 0, 1, -1]</text><text x="380.0" y="94.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">要 0 到 3 的路径：从终点 3 顺着 parent 往回走</text><text x="380.0" y="122.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">3  →  parent[3] = 1  →  parent[1] = 2  →  parent[2] = 0  →  -1 停</text><text x="380.0" y="150.9" font-size="13.5" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">倒过来：[0, 2, 1, 3]，总长 1 + 2 + 1 = 4</text></svg>