.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">2'</text><circle cx="610.0" cy="170.0" r="17" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="610.0" y="175.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">3'</text><circle cx="500.0" cy="170.0" r="17" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/><text x="500.0" y="175.4" font-size="15" fill="#1F2937" text-anchor="middle" font-family="Menlo, Consolas, DejaVu Sans Mono, PingFang SC, monospace" font-weight="700">4'</text><text x="18.0" y="220.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">dfs(node)：node 已经在 copies 里，直接返回那个新节点；</text><text x="18.0" y="244.9" font-size="13.5" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">否则新建一个，先记进 copies，再把每个邻居 dfs 一遍，返回值接到新节点的 neighbors 上</text><text x="18.0" y="268.9" font-size="13.5" fill="#D97706" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">copies 同时是 visited：走回 1 时，1 已经在字典里，直接拿到 1′，不会绕圈</text></svg>