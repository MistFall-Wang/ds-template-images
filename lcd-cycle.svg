CJK SC, Helvetica, Arial, sans-serif">相遇时 slow 走了 a + b = 5 步，fast 走了 10 步，多出来的 5 步正好是一圈（b + c = 5）</text><text x="40.0" y="249.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">所以 a + b = b + c，也就是 a = c：从头走 2 步、从相遇点走 2 步，都到入环点 3</text></svg>