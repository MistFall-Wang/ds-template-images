PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif">它们在原数组里都排在 3 前面 → 每个都和 3 组成一个逆序对</text><text x="480.0" y="116.9" font-size="13.5" fill="#DC2626" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">count += len(left) − i = 3 − 1 = 2</text></svg>