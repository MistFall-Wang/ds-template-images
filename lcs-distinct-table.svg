font-weight="700">这个 a 配不上，只能不用：上面 dp[5][1] = 3（紫）</text><text x="308.0" y="266.0" font-size="14" fill="#1F2937" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"></text><text x="308.0" y="291.0" font-size="14" fill="#6B7280" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">第 0 列全是 1：t 的前 0 个字符是空串，什么都不选，1 种</text><text x="308.0" y="316.0" font-size="14" fill="#6B7280" text-anchor="start" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif" font-weight="700">第 0 行其余是 0：s 是空串，选不出非空的 t</text></svg>